<div class="edit-expense">
  <!-- Page Header -->
  <header class="page-header">
    <h1>Edit Expense</h1>
    <p>Update the details of your expense</p>
  </header>

  <!-- Form Container -->
  <div class="form-container">
    <form [formGroup]="form" (ngSubmit)=" onSubmit()">
      <!-- Date Field -->
      <div class="form-group">
        <label for="date">Date <span style="color: var(--color-danger)">*</span></label>
        <input
          id="date"
          type="date"
          formControlName="date"
          (blur)="form.get('date')?.markAsTouched()"
        />
        <span class="error-message" *ngIf="form.get('date')?.touched && form.get('date')?.invalid">
          Date is required
        </span>
      </div>

      <!-- Category and Amount Row -->
      <div class="form-row">
        <!-- Category Field -->
        <div class="form-group">
          <label for="category">Category <span style="color: var(--color-danger)">*</span></label>
          <input
            id="category"
            type="text"
            placeholder="E.g., Food"
            formControlName="category"
            (blur)="form.get('category')?.markAsTouched()"
          />
          <span
            class="error-message"
            *ngIf="form.get('category')?.touched && form.get('category')?.invalid"
          >
            Category is required
          </span>
        </div>

        <!-- Amount Field -->
        <div class="form-group">
          <label for="amount">Amount <span style="color: var(--color-danger)">*</span></label>
          <input
            id="amount"
            type="number"
            placeholder="0.00"
            formControlName="amount"
            (blur)="form.get('amount')?.markAsTouched()"
          />
          <span
            class="error-message"
            *ngIf="form.get('amount')?.touched && form.get('amount')?.invalid"
          >
            Amount is required
          </span>
        </div>
      </div>

      <!-- Description Field -->
      <div class="form-group">
        <label for="description"
          >Description <span style="color: var(--color-danger)">*</span></label
        >
        <input
          id="description"
          type="text"
          placeholder="E.g., Lunch with colleagues"
          formControlName="description"
          (blur)="form.get('description')?.markAsTouched()"
        />
        <span
          class="error-message"
          *ngIf="form.get('description')?.touched && form.get('description')?.invalid"
        >
          Description is required
        </span>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button
          type="submit"
          [disabled]="form.invalid || ((loading$ | async) ?? false)"
        >
          {{ ((loading$ | async) ?? false) ? 'Updating...' : 'Update Expense' }}
        </button>
      </div>
    </form>
  </div>
</div>
